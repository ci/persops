[[actions]]
name = "workspace-update-stale"
lua = '''
local _, err = jj("workspace", "update-stale")
if err then
  error(err)
end
revisions.refresh()
'''

[[bindings]]
action = "workspace-update-stale"
seq = ["w", "u"]
scope = "revisions"
desc = "workspace update-stale"

[ui]
theme = "base16-catppuccin-mocha"
