# iamb Matrix client; see `man 5 iamb` for every option.
default_profile = "ca7ir"

[profiles.ca7ir]
user_id = "@c:ca7.ir"

[profiles.oxide]
user_id = "@catalin:oxide.computer"

[settings]
# Show display names next to messages instead of full user IDs.
username_display = "displayname"
# Keep display name and avatar changes out of room timelines; they're listed in :nicks.
profile_change_display = "hide"

[settings.mouse]
enabled = true

# <Space> is the leader key in normal mode.
[macros.normal]
# Go to a list.
"<Space>gc" = ":chats<Enter>"
"<Space>gd" = ":dms<Enter>"
"<Space>gr" = ":rooms<Enter>"
"<Space>gs" = ":spaces<Enter>"
"<Space>gu" = ":unreads<Enter>"
"<Space>gm" = ":mentions<Enter>"
"<Space>gi" = ":invites<Enter>"
"<Space>gb" = ":bookmarks<Enter>"
"<Space>gn" = ":nicks<Enter>"
# The selected message.
"<Space>r" = ":reply<Enter>i"
"<Space>q" = ":cancel<Enter>"
"<Space>e" = ":edit<Enter>"
"<Space>p" = ":replied<Enter>"
"<Space>i" = ":message<Enter>"
"<Space>w" = ":whois<Enter>"
"<Space>b" = ":bookmark<Enter>"
"<Space>B" = ":unbookmark<Enter>"
# Catching up.
"<Space>c" = ":catchup<Enter>"
"<Space>x" = ":catchup read<Enter>"
"<Space>X" = ":catchup read above<Enter>"
"<Space>R" = ":catchup read room<Enter>"
"<Space>u" = ":catchup undo<Enter>"
"<Space>f" = ":catchup refresh<Enter>"
# Folding rooms in :catchup.
"<Tab>" = ":catchup toggle<Enter>"
"za" = ":catchup toggle<Enter>"
"zM" = ":catchup collapse<Enter>"
"zR" = ":catchup expand<Enter>"
